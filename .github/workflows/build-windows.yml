name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pillow-heif nuitka ordered-set zstandard

      - name: Download ExifTool
        run: |
          New-Item -ItemType Directory -Force -Path exiftool_files | Out-Null
          
          # Check if exiftool.exe already exists in repo
          if (Test-Path "exiftool.exe") {
            Write-Host "✓ Using existing exiftool.exe"
            Copy-Item exiftool.exe exiftool_files\exiftool.exe -Force
          } else {
            # Download from exiftool.org
            Write-Host "Downloading ExifTool from exiftool.org..."
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri "https://exiftool.org/exiftool-13.52_64.zip" -OutFile exiftool.zip -TimeoutSec 60
            Expand-Archive exiftool.zip -DestinationPath exiftool_files -Force
            
            # Find and rename exiftool.exe
            $exeFile = Get-ChildItem exiftool_files -Filter "exiftool*.exe" -Recurse | Select-Object -First 1
            if ($exeFile) {
              Move-Item $exeFile.FullName exiftool_files\exiftool.exe -Force
              Write-Host "✓ ExifTool downloaded and extracted"
            } else {
              Write-Error "✗ ExifTool.exe not found in archive"
              exit 1
            }
            Remove-Item exiftool.zip -Force -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Get version
        id: version
        run: echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --enable-plugin=pyqt6 `
            --include-data-dir=assets=assets `
            --include-data-dir=exiftool_files=exiftool_files `
            --include-data-file=exiftool.exe=exiftool.exe `
            --include-data-file=pro_dark.qss=pro_dark.qss `
            --include-package=cv2 `
            --include-package=PIL `
            --include-package=numpy `
            --include-package=rawpy `
            --include-package=imagehash `
            --include-package=skimage `
            --include-package=pillow_heif `
            --include-package-data=cv2 `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=scipy `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=torch `
            --nofollow-import-to=torchvision `
            --nofollow-import-to=simple_lama_inpainting `
            --windows-icon-from-ico=assets\icon.ico `
            --windows-console-mode=disable `
            --company-name="Widlily Corporation" `
            --product-name="WiPhoto" `
            --file-version=2.4.1.0 `
            --product-version=2.4.1 `
            --file-description="WiPhoto - Professional Photo Manager" `
            --assume-yes-for-downloads `
            --output-dir=build `
            main.py
        shell: pwsh

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path dist\WiPhoto_Windows | Out-Null
          Copy-Item -Recurse -Force build\main.dist\* dist\WiPhoto_Windows\
          Rename-Item dist\WiPhoto_Windows\main.exe WiPhoto.exe
          
          # Verify ExifTool files are included
          if (Test-Path dist\WiPhoto_Windows\exiftool.exe) {
            Write-Host "✓ ExifTool executable bundled"
          } else {
            Write-Error "✗ ExifTool executable NOT found in bundle!"
            exit 1
          }
          
          if (Test-Path dist\WiPhoto_Windows\exiftool_files) {
            Write-Host "✓ ExifTool folder bundled"
            Get-ChildItem dist\WiPhoto_Windows\exiftool_files | Write-Host
          } else {
            Write-Warning "⚠ ExifTool folder not found (may be OK if only exe is needed)"
          }
          
          Compress-Archive -Path dist\WiPhoto_Windows -DestinationPath dist\WiPhoto_${{ steps.version.outputs.VERSION }}_Windows.zip -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiPhoto-Windows
          path: dist/WiPhoto_${{ steps.version.outputs.VERSION }}_Windows.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/WiPhoto_${{ steps.version.outputs.VERSION }}_Windows.zip
          draft: false
          prerelease: false
