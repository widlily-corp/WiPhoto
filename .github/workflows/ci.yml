name: WiPhoto CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.platform }}

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Lint
        run: |
          npx eslint src/
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: JS Tests
        run: npm run test

      - name: Rust Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.platform }}-release

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Prepare Signing Key
        shell: bash
        run: |
          KEY_FILE="$RUNNER_TEMP/tauri-signing-key.txt"
          node -e "
            const fs = require('fs');
            const raw = (process.env.RAW_KEY || '').trim();
            if (!raw) {
              console.log('OTA Private Key is empty. Disabling updater artifacts in config...');
              try {
                const confPath = 'src-tauri/tauri.conf.json';
                const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
                if (conf.bundle) { conf.bundle.createUpdaterArtifacts = false; }
                fs.writeFileSync(confPath, JSON.stringify(conf, null, 2));
                console.log('Successfully disabled createUpdaterArtifacts');
              } catch (e) {
                console.error('Failed to update config', e);
              }
            } else {
              console.log('Normalizing OTA signing key...');
              let normalizedBase64 = '';
              if (raw.startsWith('untrusted comment:') || raw.includes('untrusted comment:')) {
                const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                const commentIdx = lines.findIndex(l => l.startsWith('untrusted comment:'));
                const commentLine = lines[commentIdx];
                const keyPayload = lines.slice(commentIdx + 1).join('').replace(/[^A-Za-z0-9+/=]/g, '');
                const cleanText = commentLine + '\n' + keyPayload + '\n';
                normalizedBase64 = Buffer.from(cleanText, 'utf8').toString('base64');
              } else {
                const clean = raw.replace(/\s+/g, '');
                try {
                  const decoded = Buffer.from(clean, 'base64').toString('utf8');
                  if (decoded.includes('untrusted comment:')) {
                    normalizedBase64 = clean;
                  } else {
                    const wrapped = 'untrusted comment: minisign secret key\n' + clean + '\n';
                    normalizedBase64 = Buffer.from(wrapped, 'utf8').toString('base64');
                  }
                } catch (e) {
                  const wrapped = 'untrusted comment: minisign secret key\n' + clean + '\n';
                  normalizedBase64 = Buffer.from(wrapped, 'utf8').toString('base64');
                }
              }
              fs.writeFileSync(process.env.KEY_FILE, normalizedBase64, 'utf8');
              console.log('Key successfully normalized. Base64 length:', normalizedBase64.length);
            }
          "
          if [ -f "$KEY_FILE" ]; then
            NORM_KEY=$(cat "$KEY_FILE" | tr -d '\r\n ')
            echo "TAURI_SIGNING_PRIVATE_KEY=$NORM_KEY" >> "$GITHUB_ENV"
            echo "TAURI_PRIVATE_KEY=$NORM_KEY" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
            echo "TAURI_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
            echo "Key exported to GITHUB_ENV"
          fi
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_FILE: ${{ runner.temp }}/tauri-signing-key.txt

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ env.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'WiPhoto v__VERSION__'
          releaseBody: 'WiPhoto v__VERSION__ release.'
          releaseDraft: false
          prerelease: false
