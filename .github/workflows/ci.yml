name: WiPhoto CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.platform }}

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Lint
        run: |
          npx eslint src/
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: JS Tests
        run: npm run test

      - name: Rust Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.platform }}-release

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Prepare Signing Key
        shell: bash
        run: |
          KEY_FILE="$RUNNER_TEMP/tauri-signing-key.txt"
          node -e "
            const fs = require('fs');
            const key = process.env.RAW_KEY || '';
            if (!key.trim()) {
              console.log('Key is empty, disabling updater artifacts...');
              try {
                const confPath = 'src-tauri/tauri.conf.json';
                const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
                if (conf.bundle) { conf.bundle.createUpdaterArtifacts = false; }
                fs.writeFileSync(confPath, JSON.stringify(conf, null, 2));
              } catch (e) { console.error('Failed to update config', e); }
            } else {
              console.log('Normalizing key...');
              const lines = key.replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
              const commentIdx = lines.findIndex(l => l.startsWith('untrusted comment:'));
              let commentLine, base64Payload;
              if (commentIdx >= 0) {
                commentLine = lines[commentIdx];
                base64Payload = lines.slice(commentIdx + 1).join('').replace(/[^A-Za-z0-9+/=]/g, '');
              } else {
                commentLine = key.toLowerCase().includes('encrypted')
                  ? 'untrusted comment: minisign encrypted secret key'
                  : 'untrusted comment: minisign secret key';
                base64Payload = lines.join('').replace(/[^A-Za-z0-9+/=]/g, '');
              }
              const keyContent = commentLine + String.fromCharCode(10) + base64Payload;
              fs.writeFileSync(process.env.KEY_FILE, keyContent, 'utf8');
              console.log('Comment:', commentLine);
              console.log('Payload length:', base64Payload.length);
              console.log('Key written to file');
            }
          "
          if [ -f "$KEY_FILE" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<__SIGNING_KEY_BOUNDARY__"
              cat "$KEY_FILE"
              echo ""
              echo "__SIGNING_KEY_BOUNDARY__"
            } >> "$GITHUB_ENV"
            echo "Key loaded into GITHUB_ENV"
          fi
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_FILE: ${{ runner.temp }}/tauri-signing-key.txt

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'WiPhoto v__VERSION__'
          releaseBody: 'WiPhoto v__VERSION__ release.'
          releaseDraft: false
          prerelease: false
