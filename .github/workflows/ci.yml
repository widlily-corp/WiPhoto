name: WiPhoto CI

on:
  push:
    branches: [ main, beta-rust+tauri ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, beta-rust+tauri ]

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Run Linting
        run: |
          npx eslint src/
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run JS Unit Tests
        run: npm run test

      - name: Run Rust Backend Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build Tauri App
    needs: test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Validate and Format Tauri Key
        id: format-key
        run: |
          node -e "
            const fs = require('fs');
            let key = process.env.RAW_KEY || '';
            if (!key.trim()) {
              console.log('Key is empty, disabling updater artifacts...');
              try {
                const confPath = 'src-tauri/tauri.conf.json';
                const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
                if (conf.bundle) { conf.bundle.createUpdaterArtifacts = false; }
                fs.writeFileSync(confPath, JSON.stringify(conf, null, 2));
              } catch (e) { console.error('Failed to update config', e); }
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'formatted_key=\n');
            } else {
              console.log('Normalizing key...');
              key = key.replace(/\r/g, '');
              let isEncrypted = key.toLowerCase().includes('encrypted');
              let commentLine = isEncrypted 
                  ? 'untrusted comment: minisign encrypted secret key'
                  : 'untrusted comment: minisign secret key';
              
              let base64Payload = key;
              if (key.includes('untrusted comment')) {
                  base64Payload = key.replace(/untrusted comment:.*?(key)/i, '');
              }
              base64Payload = base64Payload.replace(/\s+/g, '');
              const formatted = commentLine + '\n' + base64Payload;
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'formatted_key<<EOF\n' + formatted + '\nEOF\n');
            }
          "
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.format-key.outputs.formatted_key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'WiPhoto v__VERSION__'
          releaseBody: 'WiPhoto v__VERSION__ release.'
          releaseDraft: false
          prerelease: false

