[package]
name = "wiphoto"
version = "5.0.10"
description = "WiPhoto - Professional Photo Manager & Editor"
authors = ["Widlily Corporation <widlily.corp@gmail.com>"]
edition = "2021"

[lib]
name = "wiphoto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = { version = "0.25", features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "ico"] }
imageproc = "0.25"
ab_glyph = "0.2"
base64 = "0.22"

# File system
walkdir = "2"
glob = "0.3"

# Parallelism
rayon = "1"

# EXIF metadata
kamadak-exif = "0.5"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
once_cell = "1"
memchr = "2"

# ML and HTTP for downloading models
tract-onnx = "0.21.3"
ureq = "2.9"
roxmltree = "0.20.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
